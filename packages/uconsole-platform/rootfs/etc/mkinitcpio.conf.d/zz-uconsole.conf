# The panel's iovcc supply is provided by the AXP228. Module dependencies
# alone do not pull in its bus and regulator drivers: CM4 uses bcm2708 I2C,
# CM5 uses GPIO I2C. Load both buses and the PMIC before the display stack.
# VC4 also waits for HDMI's DDC bus, even when using only the DSI panel.
# Include its driver early so graphics do not wait until the real root boots.
MODULES+=(i2c_bcm2708 i2c_gpio i2c_brcmstb axp20x_i2c axp20x_regulator vc4 panel-cwu50 ocp8178_bl)
# The PMIC can create the battery device before mounting root. Apply the
# charging ceiling in early userspace too, not just after switch_root.
FILES+=(/usr/lib/udev/rules.d/90-uconsole-charging.rules)
HOOKS=(base udev plymouth uconsole-plymouth autodetect modconf kms keyboard keymap consolefont block filesystems fsck)
