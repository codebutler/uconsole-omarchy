[UPower]
# No supported sleep state on this image: Auto -> Sleep -> Ignore in UPower
# 1.91.4 would leave critical-battery exhaustion without a graceful shutdown.
CriticalPowerAction=PowerOff
AllowRiskyCriticalPowerAction=false
UsePercentageForPolicy=true
# Preserve the existing UPower thresholds. Gauge estimates are not a hardware
# undervoltage cutoff and cannot guarantee protection from deep discharge.
PercentageLow=20.0
PercentageCritical=5.0
PercentageAction=2.0
