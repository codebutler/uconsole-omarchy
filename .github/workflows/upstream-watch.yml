name: upstream availability
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Omarchy repository availability and package recipe syntax
        run: |
          set -euo pipefail
          curl -fsSIL https://pkgs.omarchy.org/edge/aarch64/omarchy.db >/dev/null
          for pkgbuild in packages/*/PKGBUILD; do
            echo "checking source declarations in ${pkgbuild}"
            bash -n "${pkgbuild}"
          done
